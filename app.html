<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>EditPro Studio App</title><link rel="stylesheet" href="app.css"></head><body><header class="topbar"><a href="index.html" class="brand">EditPro<span>Studio</span></a><div class="top-actions"><label for="fileInput" class="btn upload">Upload Image</label><input id="fileInput" type="file" accept="image/*" hidden><button id="downloadBtn" class="btn primary">Download PNG</button><button id="downloadJpgBtn" class="btn upload">Download JPG</button></div></header><main class="app-layout"><aside class="panel left-panel"><h2>Templates</h2><button class="template active" data-template="news">News Poster</button><button class="template" data-template="reel">Reel Cover</button><button class="template" data-template="product">Product Ad</button><button class="template" data-template="clean">Clean</button><h2>Size</h2><div class="grid-2"><button class="ratio" data-ratio="1:1">1:1</button><button class="ratio" data-ratio="3:4">3:4</button><button class="ratio active" data-ratio="9:16">9:16</button><button class="ratio" data-ratio="16:9">16:9</button></div><h2>Project</h2><button id="saveBtn" class="wide">Save Settings</button><button id="loadBtn" class="wide">Load Settings</button><button id="resetBtn" class="wide danger">Reset</button></aside><section class="canvas-wrap"><div class="canvas-card"><canvas id="editorCanvas" width="1080" height="1920"></canvas><div id="emptyState" class="empty">Upload an image to start</div></div><p class="hint">Tip: drag headline or caption directly on the image. Export gives high-resolution PNG or JPG.</p></section><aside class="panel right-panel"><h2>Text</h2><label>Headline<input id="headline" type="text" value="Breaking News"></label><label>Caption<input id="caption" type="text" value="Full story in caption"></label><label>Headline Size<input id="headlineSize" type="range" min="36" max="120" value="78"></label><label>Caption Size<input id="captionSize" type="range" min="24" max="80" value="48"></label><label>Headline Position<input id="headlineY" type="range" min="3" max="45" value="8"></label><label>Caption Position<input id="captionY" type="range" min="55" max="97" value="90"></label><label>Text Align<select id="textAlign"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></label><label>Text Color<input id="textColor" type="color" value="#ffffff"></label><label>Text Shadow<input id="shadow" type="range" min="0" max="30" value="8"></label><label><input id="watermark" type="checkbox" checked> Show Watermark</label><h2>Image Adjust</h2><label>Brightness<input id="brightness" type="range" min="50" max="150" value="100"></label><label>Contrast<input id="contrast" type="range" min="50" max="170" value="105"></label><label>Saturation<input id="saturation" type="range" min="0" max="200" value="105"></label><label>Background Blur<input id="blur" type="range" min="0" max="12" value="0"></label><label>Dark Overlay<input id="overlay" type="range" min="0" max="95" value="75"></label></aside></main><script src="app.js"></script><script src="direct-edit.js"></script></body></html>
