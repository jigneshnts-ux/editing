<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EditPro Studio Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="workspace-body">
  <header class="workspace-header">
    <a class="logo" href="index.html">EditPro<span>Studio</span></a>
    <div class="workspace-actions">
      <label class="upload-button" for="workspaceFile">Upload</label>
      <input id="workspaceFile" type="file" accept="image/*,video/*" hidden />
      <button id="saveWorkspace">Save</button>
      <button id="loadWorkspace">Load</button>
      <button id="exportWorkspace">Export PNG</button>
    </div>
  </header>

  <main class="workspace-shell">
    <aside class="workspace-sidebar">
      <button class="tool-tab active" data-tool="templates">Templates</button>
      <button class="tool-tab" data-tool="text">Text</button>
      <button class="tool-tab" data-tool="adjust">Adjust</button>
      <button class="tool-tab" data-tool="layers">Layers</button>
    </aside>

    <section class="workspace-panel" id="toolPanel">
      <h2>Templates</h2>
      <button class="template-card" data-template="news">Breaking News</button>
      <button class="template-card" data-template="reel">Reel Hook</button>
      <button class="template-card" data-template="product">Product Promo</button>
      <button class="template-card" data-template="clean">Clean Image</button>
    </section>

    <section class="workspace-canvas-area">
      <div class="workspace-ratios">
        <button data-workspace-ratio="1 / 1">Square</button>
        <button data-workspace-ratio="3 / 4">Post</button>
        <button data-workspace-ratio="9 / 16" class="active">Reel</button>
        <button data-workspace-ratio="16 / 9">Wide</button>
      </div>
      <div class="workspace-stage" id="workspaceStage">
        <canvas id="workspaceCanvas" width="1080" height="1920"></canvas>
        <div class="empty-workspace" id="emptyWorkspace">Upload an image to start editing</div>
      </div>
    </section>

    <aside class="properties-panel">
      <h2>Properties</h2>
      <label>Headline<input id="headlineInput" type="text" value="Breaking News"></label>
      <label>Caption<input id="captionInput" type="text" value="Full story in caption"></label>
      <label>Brightness<input id="wsBrightness" type="range" min="60" max="140" value="100"></label>
      <label>Contrast<input id="wsContrast" type="range" min="60" max="160" value="100"></label>
      <label>Saturation<input id="wsSaturation" type="range" min="0" max="180" value="100"></label>
      <label>Overlay<input id="wsOverlay" type="range" min="0" max="90" value="70"></label>
      <label>Headline Y<input id="headlineY" type="range" min="2" max="45" value="6"></label>
      <label>Caption Y<input id="captionY" type="range" min="55" max="98" value="92"></label>
    </aside>
  </main>

  <script src="workspace.js"></script>
</body>
</html>
